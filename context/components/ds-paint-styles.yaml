    id: "S:5523e640a00e2c75383a52f63ee668259e25228f,"
    key: 5523e640a00e2c75383a52f63ee668259e25228f
    description: "Dégradé signature 42 — Pink/400 (#F670C7) → Purple/300 (#BDB4FE).\nL'identité tient au COUPLE DE COULEURS ; le suffixe n'est qu'une orientation.\n\nGRILLE — un style par direction, convention (Ndeg) identique aux groupes Brand/ et Gray/ :\n0 · 45 · 90 · 180 · 225 · 270. Les pas 135 et 315 n'existent pas — à créer si besoin.\nTous les stops sont dans le même ordre (pink → purple) : seule l'orientation change.\n\nALPHA — 270deg-alpha8 / -alpha16 / -alpha60 pour les fonds et les surfaces discrètes.\n\nMODES — bindé aux primitives (Colors/Pink/400, Colors/Purple/300), donc CONSTANT en\nLight comme en Dark. Voulu : une couleur d'identité ne bascule pas avec le thème."
    paints:
      - type: GRADIENT_LINEAR
        stops:
          ["#F670C7 @0", "#BDB4FE @1"]
