  Background/Canvas:
    id: "S:5fdefca837ea730671b8b6aef0fd48637812703a,"
    key: 5fdefca837ea730671b8b6aef0fd48637812703a
    description: "App canvas background. Apply to the ROOT frame of a screen — never rebuild it by hand, never place a rectangle behind the content.\n\nCOMPOSITION\n1. Radial gradient #0A1E41 (center) -> #030D20 (edge), ellipse mapped to the frame bounds.\n2. Grain texture, Soft Light blend, 24% opacity, tiled at 1:1 so density stays constant at any frame size.\n\nSCOPE\nScreens only (survey screens and full-page layouts). Do NOT apply to Card or any nested surface: cards stay translucent (bg-primary) and let this canvas show through. Stacking the grain on cards breaks the texture continuity.\n\nMODES\nDark only. Paint styles do not follow variable modes — a Light equivalent must be a separate style.\n\nCODE\nbackground: radial-gradient(ellipse 100% 100% at 50% 50%, #0A1E41 0%, #030D20 100%);\ngrain: ::after with background-repeat: repeat; mix-blend-mode: soft-light; opacity: .24;"
    paints:
      - type: GRADIENT_RADIAL
        stops:
          ["#0A1E41 @0", "#030D20 @1"]
      - type: IMAGE
        blendMode: SOFT_LIGHT
        opacity: 0.24
        scaleMode: TILE
        scalingFactor: 1
        imageHash: 64f99940bd6e24372f2a6f3db246d0d61b569c2c
