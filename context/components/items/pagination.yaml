  description: "AXES - breakpoint (desktop | mobile): responsive concern, not a variant. One component reflowing at a media query. - shape (square): single value, dead axis. - type (page default): single value, dead axis. 3 declared axes for only 2 key variants. - Runtime lives on the children: _Pagination number base state (default | hover/active | focused) and Buttons/Button [V2] state are data-*, never cva variants. COMPOSITION - Horizontal auto-layout, fixed width 1216, hug height, padding 8, gap 12, both axes centered. Text 14 / Bold / 20. - Prev/next are Buttons/Button [V2]; the numbers are _Pagination number base with a Number text node. Slots arrow-left and arrow-right at depth 3 are icon-swappable. - The Button child enumerates hierarchy / white / destructive / success as axes; React splits that into variant (shape) plus the color prop (data-color). - Use under a list, table or grid at full content width. Not for carousels, that is pagination-dot-group-v2. ACCESSIBILITY - nav with aria-label Pagination; the selected page carries aria-current=page. The hover/active value is pointer feedback only. - Previous and Next need text names even when icon-only, and must be disabled at the ends rather than hidden. - Keyboard order: Previous, pages in order, Next. Any truncation ellipsis is decorative. CODE - No counterpart in @42/ui-react as of 2026-08-24. - Listed as an implementation gap in audit/parity-figma-vs-react.md section 6a. KNOWN ISSUE - The fixed 1216 width freezes a desktop container; the real component must be fluid."
