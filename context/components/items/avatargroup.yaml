  description: "AvatarGroup - an overlapping stack of avatars. AXES - No variant axis and no component property. Everything happens in the slot. SLOT - content: a horizontal auto-layout whose itemSpacing is NEGATIVE (-16). That is what makes the avatars overlap. Add or remove Avatar instances there and the width follows. Do not move the avatars by hand - x is ignored inside an auto-layout; change itemSpacing. COMPOSITION - Four Avatar instances at xl (64) overlapping by 16, so 208 x 64. Every avatar in one stack must share the same size. - There is no plus-N counter. If you need one, add a last Avatar with textInitials on and type the count into initials. ACCESSIBILITY - The stack shows faces and no names. The participants must be readable as text or from a tooltip, never inferred from the pile. CODE - @42/ui-react AvatarGroup, SHIPPED, exported from the avatar folder alongside Avatar. - It takes only spacing (xs to xl - overlap 8 / 10 / 12 / 14 / 16) and children. It does NOT resize or restyle its children: set size and color on each Avatar. - spacing=xl is the value that matches this component's -16. - The code adds a 2 px cutout border (white in light, gray-dark-900 in dark) on every child so the avatars read as cut out against the page. That border is NOT drawn here, so the coded result will look slightly different. KNOWN ISSUE - The instances carry no property: the photos, the count and the fallback showing on the third avatar are all deep overrides. - Rebuilt on the 64 rung 2026-09-10: it was four 56 px avatars overlapping by 20. Written 2026-09-10."
