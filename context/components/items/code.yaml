  description: "AXES - color (neutral, brand, green, orange, pink, purple, red): tints the TEXT only. The neutral background and border never change, whatever the colour. - size (sm, md): Kode Mono 14 or 16, matching the prose the pill sits in. Figma-only axis, see CODE. - 14 variants. No state axis: inline code has no interaction. COMPOSITION - Horizontal auto-layout, hugs both axes. Padding 6 / 2, radius 4, 1px inside border. - Surface is bg-secondary + border-primary, one step above the card it sits on. - Sits inline inside a text line. It is not a Badge: a Badge labels a thing, this quotes a literal. ACCESSIBILITY - The colour carries no meaning on its own; the token must still read as text with the tint removed. - Contrast is measured against bg-secondary over the card, not against the page. CODE - @42/ui-react Code, in react/kit v0.8.0. NOT present in kit-main. - color -> color. React accepts 12 colours (brand, gray, neutral, red, orange, yellow, green, teal, cyan, blue, purple, pink); Figma publishes the 7 of Badge. gray, yellow, teal, cyan and blue have no variant here, logged in ds-actions. - size has NO React prop: the inline element inherits the surrounding prose size. This axis exists only because Figma has no inheritance. - Code.Mark IS Mark itself, attached with Object.assign, not a second implementation."
