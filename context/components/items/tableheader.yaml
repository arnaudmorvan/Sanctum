  description: "AXES - breakpoint (desktop | mobile): responsive concern, not a variant. - title, supporting-text, badge, searchbar, primarybutton, secondarybutton, dotsicon: seven booleans that are slots in disguise, content and not shape. - avatar: single value false only. A dead axis; remove it or give it a true variant. - Only 2 key variants (desktop, mobile); content toggles are instance overrides. COMPOSITION - Vertical auto-layout, 1216 x hug, bottom padding 20, gap 20, 1px @border-secondary stroke as separator. - Slots: Badge [V2], Actions (frame holding the search input and buttons). - Nested: Badge [V2], Input field [V2] (search, icon leading, no label or hint), Button [V2]. Text nodes: Text (18/28 SemiBold), Supporting text (hint). - Only the top block of table-v2. Not a card header for the card_* layouts. ACCESSIBILITY - The title must be a real heading and should label the table via aria-labelledby. - The search input needs a label; the overflow trigger needs a name and aria-haspopup. - Actions act on the table below, so their names must say so. CODE - React: Table.Toolbar containing Table.Title; DataTable renders it from title, toolbarActions, enableGlobalFilter, enableColumnVisibility. - Card (variant plus padding plus color plus gradient; parts Header / Title / Description / Content / Footer) is the primitive for card-like headers. - Bespoke layout, not a card primitive: its axes are content toggles. React ships ONE Card primitive. Rebuild this layout as a composition of that primitive instead of shipping it as its own component. - title / supporting-text / badge / searchbar / buttons / dotsicon -> children or the DataTable toolbar props above; breakpoint -> responsive CSS. None of them is a variant in React."
