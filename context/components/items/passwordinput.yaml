  description: "PasswordInput — password field with a built-in show / hide toggle: the _BaseField shell with the reveal control in the inline-end position. Use it on its own, or swap it into the Field slot when it needs a label. AXES revealed: whether the typed value is readable. false = masked. Dots, and the eye icon: \"reveal\". true = plain text, and the eye-off icon: \"hide\". The icon always shows the action available, never the current state — same pairing as the code. Everything else — size, variant, state, status, the text and the start slot — lives on the nested _BaseField instance, which is exposed: pick it in the instance panel instead of looking for an axis here. PasswordInput does not duplicate the shell's 64 variants, it inherits them. COMPOSITION A PasswordInput can stand alone: with no label it is a bare control and needs nothing around it. As soon as it needs a label, a description or a status message, do not build that text beside it — swap it into the Field contentSlot. Field owns the whole text scaffold. Keep both statuses equal: an error Field holds a nested _BaseField in status=error. In code this is automatic. The value is the shell's text property. Both variants ship with one, because the axis only means something once something is typed. For an empty field, take revealed=false and put the placeholder back. Leave endIcon alone: it carries the toggle. The start slot is yours — a lock icon, a prefix — and it is the only one. Do not pair it with a confirm-password field by reflex: the toggle is there so retyping is not needed. ACCESSIBILITY On its own a PasswordInput has no accessible name. It gets one from the Field label (or from aria-label in code). A placeholder is not a label: it vanishes on first keystroke. The toggle is a real button in code, not decoration. It carries aria-controls and aria-expanded so assistive tech announces masked or revealed. It is drawn in endIcon here only as a stand-in — that slot is aria-hidden in code and the button is rendered beside it. It is deliberately out of the tab order (tabIndex -1): the input is the focus stop and the toggle is a pointer convenience. Do not draw a focus ring on it. Never let masking alone carry a rule — length and character requirements belong in the Field description, visible before the user types. CODE — @42/ui-react PasswordInput The nested _BaseField carries the shell props: size→size, variant→variant, status=error→invalid (or the Field error prop), state Disabled→disabled, Hovered / Focused→runtime data-* (Ark UI). revealed has no prop. The reveal state is owned by Ark's PasswordInput machine, which flips the input type between password and text and swaps the indicator icon. showStartSlot + startSlot → startSlot. endSlot has NO prop: the toggle is a real sibling button. status=success and status=warning have no React equivalent. React-only, do not mock these up here: variant=filled, size xs / lg / xl, color (focus-ring palette), readOnly, invalid override, classNames."
