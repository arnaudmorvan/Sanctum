  description: "TimeInput — hour and minute entry with an AM/PM toggle. Not an Input with a clock icon: three real controls side by side. AXES size: field height and density. sm = 36 px. md = 44 px. Default here is sm, the React default is md. Match the form around it, not the clock. showLabel: the small Hour / Minute captions above each field. This is NOT the label of the control — read CODE before you touch it, the word means two different things on the two sides. showPeriod: shows the AM / PM toggle. Off reads as 24-hour. In code this is not a switch, it follows the locale. COMPOSITION Three exposed instances, all reachable from the instance panel — never enter the component to change them: Hour field -> NumberInput Minute field-> NumberInput Period -> SegmentedControl, two tabs Set size, status and state on the NumberInput's own _BaseField instance. Keep both fields on the same size and the same status: half a field in error is a bug, not a state. The period toggle is a SegmentedControl, not a row of buttons. Exactly one tab carries Current=True — that is the whole point of the control. Two current tabs, or none, is a bug. Values are two digits, no unit suffix: 09 and 30. Never 10h in a minute field. The toggle sits after the fields, baseline-aligned with them, never above. There is no range axis. A start / end pair is TWO TimeInputs, each with its own label — one control split down the middle gives the user nothing to tell the halves apart. Seconds exist in code and are not mocked up here. Spec them in words when a screen needs them. Label, description and status message are not built next to the control: swap the whole thing into the Field contentSlot. ACCESSIBILITY Each field is a real spinbutton with its own accessible name — Hour, Minute, Second. Those names exist whether or not the caption is visible, so showLabel is a visual choice, never an accessibility one. The period toggle is a radio group of two: Left and Right move between AM and PM, Tab enters and leaves it as one stop. The control as a whole is named by the Field label. Without it a screen reader announces three orphan spinbuttons. Arrow keys step the value, the hour wraps around. CODE — @42/ui-react TimeInput size→size (React runs xs to xl, Figma stops at sm / md). showPeriod=false → format={24}. It is NOT a boolean prop: 12h vs 24h is resolved from the locale (Intl hourCycle), and the period segment only renders in a 12h cycle. Override with format (12 | 24) or hourCycle. showLabel has NO React equivalent. The Hour / Minute captions are hard-coded in TimeRow and always render. Careful, the collision is real: the React `label` prop is the Field label of the whole control (Meeting time), not these captions. Do not read showLabel as label. value is { hour, minute, second? } | null. hour is ALWAYS stored in 24h whatever the display. Composed in code from NumberInput x2 + SegmentGroup — Ark ships no time-picker machine. Same row DatePicker will embed. Naming gap: this file calls the control SegmentedControl, the kit exports it as SegmentGroup. Same object. Current=True on a tab → the selected value of the SegmentGroup. React-only, do not mock these up here: withSeconds, minuteStep, locale, hourCycle, variant, color, disabled, readOnly, invalid, required, name, ref, onBlur, classNames. KNOWN GAPS IN THIS SET The Hour / Minute captions are raw text layers, not text properties — they cannot be overridden from the panel and are English only. Same in code, where they are hard-coded. No withSeconds mock-up, and no Field around the control."
