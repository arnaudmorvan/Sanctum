  page: "      ↳ Checkbox"
  description: "Checkbox — a single boolean (or tri-state) selection control with an inline label. It reuses the family's shared control surface, so a checkbox sits flush beside an Input, and it carries its own label and supporting text. AXES checked False = empty box, the resting state True = check mark on a filled box indeterminate False = the checked state above applies as-is True = partial (minus) mark; parent-driven, e.g. a \"select all\" header whose children are only partly checked Size sm = 16px box, 14/20 text, 8px gap md = 20px box, 16/24 text, 12px gap showLabel True = box + label (+ supporting text) False = bare box, for table headers and dense grids state Default / Hover / Focused / Disabled showDescription (boolean, not an axis) Reveals the supporting text under the label. Available on every variant, independent of the axes above. COMPOSITION Override \"Text\" and \"Supporting text\" in place. Do not detach the component to restyle them. The box is top-aligned with a 2px optical offset, so it stays on the label's first line once the supporting text is on. indeterminate never sets itself. It summarises children, and is owned by whatever renders the group. Reach for RadioGroup when the options are mutually exclusive, and for Switch when the toggle takes effect immediately. Checkbox is for multi-select, and for consent applied on submit. indeterminate is only built with showLabel=False. A labelled \"select all\" row has no variant today — extend the set rather than detaching an instance. ACCESSIBILITY Space toggles. The label is clickable and toggles the box. Focus is a 2px ring on the focus-ring token with a 2px offset, drawn outside the box. Never remove it, and never rely on Hover alone. indeterminate maps to aria-checked=\"mixed\", not to a third value. Announce it as \"partially checked\". showLabel=False has no accessible name of its own. Every bare box needs an aria-label in code, or a visually hidden label. The box is 16-20px; the interactive target must reach 24px minimum. The label row supplies it when showLabel=True — a bare box does not, so pad it in code. CODE — @42/ui-react <Checkbox> checked=True / False -> checked / defaultChecked indeterminate=True -> checked=\"indeterminate\" showLabel=True -> label showDescription -> description state=Disabled -> disabled state=Hover / Focused -> CSS states, not props Size=sm -> size=\"sm\" Size=md -> size=\"md\" (drawn wrong, see below) Size is off by one step. React ships xs/sm/md/lg/xl — 14/16/18/20/24 px boxes. Figma's sm matches React's sm exactly. Figma's md is drawn at React's lg metrics (20px box, 16px label), so React's real md — what a bare <Checkbox /> renders — has no Figma variant at all. No Figma equivalent. Do not mock these up here: variant = \"default\" | \"filled\" — the checked fill, monochrome or palette-tinted. Figma only draws \"default\". color — tints the filled variant. There is no color axis here. invalid / error — red border plus a message below the control. required — the semantic flag and the red asterisk on the label. readOnly — keeps full contrast but rejects changes. name / value — native form submission through a hidden input. onCheckedChange / onBlur / ref — runtime only."
