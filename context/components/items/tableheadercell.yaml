  description: "TableHeaderCell — the top cell of a column: label, sort cue, filter entry point, or the select-all checkbox. AXES Text: True | False. True shows the label and its icon row. Checkbox: True | False. Selection column only. Only 3 of the 4 combinations exist. Text=True + Checkbox=True is MISSING: a selection column cannot carry a label today. Text=False + Checkbox=False is the empty header of an actions column. Icon booleans, all false by default, shown next to the label: Chevrons = sortable column, currently unsorted. Arrow up = active sort, ascending. Arrow down = active sort, descending. Filter = column filter entry point. Calendar = the column holds dates. Help icon = Tooltip explaining the column. Turn ON ONE sort icon at a time: Chevrons OR Arrow up OR Arrow down, never two. COMPOSITION One TableHeaderCell per column, first child of the column frame, on top of the TableCell stack. Its horizontal padding (24) matches TableCell — keep it or the column stops aligning. The label is a plain text layer, not a TEXT property: edit it in place. Height is fixed (44) and does not follow cell density. A column is sortable or it is not: if it is, always show an icon (Chevrons at rest), otherwise the header reads as static. Selection column: Checkbox=True here, a Checkbox in every TableCell of the same column, first column of the table. ACCESSIBILITY The sort icon is the only visible cue that a column is interactive: keep it visible, never hover-only. Help icon is a Tooltip trigger — it needs a real tooltip and a focusable trigger in code, not a decorative icon. Select-all checkbox: labelled in code, and indeterminate on a partial selection (that state is not mocked here). CODE — @42/ui-react Table.HeaderCell (th, scope=\"col\") Table.HeaderCell renders the label only. Sort, filter and resize UI live one layer up, in DataTable (DataTableHeaderCell + the TanStack column API). The icon booleans map to column state, not to props: sorting → column.getIsSorted() picks the icon, Filter → meta.filter, Calendar / Help icon → your own header renderer. aria-sort is set in code on the th. No Figma equivalent, do not mock these up here: column resizing, the filter popover, aria-sort, and any sorted / hovered header state."
