  page: "      ↳ Badges"
  description: "AXES - color (brand, error, gray, pink, purple, success, warning): a palette axis, semantic names. - filled (false, true): the shape axis, filled surface against soft/bordered. size (sm, md, lg). - icon (dot, simple, icon leading, icon trailing, only, country, avatar): composition; icon = only drops the text node. - close (false, true) and three swap props: composition, not shape. - 294 published variants, color x icon x filled x size flattened into one set. No state axis: a badge is not interactive. COMPOSITION - Horizontal auto-layout, gap 2, padding 2/4, radius 6; fill @bg-blue-secondary, stroke @border-blue-secondary, text 12/18 Medium. - Text node &quot;Text&quot;; nested _Dot (size sm/md/lg, outline bool) and x. - A badge labels, it does not act. If it must be selectable or removable, use chips-42. ACCESSIBILITY - Dot and leading icon are decorative; the status must be readable in the label text, not in the hue. - filled = false on pale palettes (pink, warning) is the weakest pairing: check @text-*-secondary on @bg-*-secondary at 4.5:1 for 12 px text. - close = true draws an x with no name; if it is really clickable it needs an aria-label and a 24 px target, which sm does not reach. CODE - React: Badge. filled -&gt; variant (filled|light|outline|subtle|default|gradient); color -&gt; prop color as data-color; size -&gt; size, aligned sm/md/lg; icon and close -&gt; children. - React palettes are hue-named (brand, gray, red, orange, yellow, green, teal, cyan, blue, purple, pink): error/success/warning must be remapped. - Badge has no close affordance and no state prop; the removable chip is Pill. variant = gradient (added 2026-09-10, node ids 22918:2 / 22918:8 / 22918:14): the only variant that IGNORES color — the React component drops data-color and always paints purple-300 -> pink-400 left to right, black text and icons, white/20 border. Published for color=brand only, one row per size at the bottom of the set: crossing it with the 7 other palettes would publish 21 identical variants and lie about the model."
