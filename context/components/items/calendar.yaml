  page: "      ↳ Calendar"
  description: "AXES - type (Single date | Dual dates): the real shape axis, one date or a range. - opened (True | False): runtime state frozen as an axis. In code the panel open state is Ark data-*, never a cva variant. - state (Placeholder | Active): runtime state frozen as an axis, whether a value has been picked. - modal (False | True): duplicates the whole CalendarModal set inside this one. Pick one of the two and delete the other. - 9 published variants out of the 16 the four axes allow: the matrix is incomplete, and modal=True exists in exactly one combination. COMPOSITION - Vertical auto-layout: a Buttons/Button trigger (label 14/20, sample Select dates) plus a _Date picker menu instance, 808 x 524. - _Date picker menu splits into Leading content (9 _Date picker list item preset rows, 152 wide) and Trailing content (the Date pickers grid, 656 x 392, over a Bottom panel, 656 x 132, holding the Apply and Cancel actions). - Trigger plus anchored panel. On small screens use CalendarModal rather than stretching this one. ACCESSIBILITY - Keyboard: arrows by day, PageUp/PageDown by month, Home/End to week bounds, Escape closes and returns focus to the trigger. - The trigger owns aria-expanded; the focused day and the selected day must be distinguishable without colour. - 12h vs 24h and the first day of week are locale-driven, not hardcoded; a range must announce both endpoints, not only the last click. - The preset rows are real buttons and need text labels. CODE - There is no date-picker in @42/ui-react: docs/rfcs/date-picker.md specifies DatePicker / Calendar / TimeField as a draft with no implementation in packages/react/src. - TimeInput ships (format, hourCycle, minuteStep, withSeconds, locale, size, variant, color, plus the Field props) and is the low-confidence match recorded in the parity report. That match is unconfirmed. - On implementation, opened and state must become Ark data-*, and modal a separate surface, not a fourth axis. KNOWN ISSUE - The hour axis flagged in the parity report as a typo of hover is gone from the file; the index and the report are stale on this component."
