  page: "      ↳ Charts"
  description: "Bar chart - comparing categories against each other. AXES - orientation: vertical (default) or horizontal. Go horizontal as soon as the category labels are long: rotated labels are a rejection. - grouping: single (default), grouped (three series side by side) or stacked (three series piled up). - grouped and stacked show the legend, single does not. COMPOSITION Same shell as Chart / Line. Bars live in one auto-layout row (or column) so they redistribute on resize; each bar fills its slot and only the height (or width) carries the value. Radius xs on the two end corners only, so the baseline stays flat. Series 1 utility-brand-600, then 500, 400, 300, 200, then utility-gray-200 for series 6. One hue, six steps, in that order. Grid stays on border-primary and labels on text-tertiary: hues live in the marks, never in the chrome. Category labels are Lato, axis values are Kode Mono. That contrast is the point: one register names, the other measures. ACCESSIBILITY Bar length is the only encoding, so the axis must start at zero. A truncated axis on a bar chart lies, and no token gate can see it. CODE @42/ui-react, component Chart (import from index.ts/chart), a wrapper over TanStack Charts. The chart TYPE is not a prop: it comes from the definition and the marks passed to the chart. So the variant axes below do NOT map one to one onto React props, they map onto separate definitions. Colour maps exactly: color takes one Color for a one-series chart (sets data-color and the ts-chart-1 slot), colors takes an ordered Color array for a multi-series chart (sets ts-chart-1 to ts-chart-N, see CHART_PALETTE and chartColors). TanStack cycles six categorical slots by default, which is why the Figma ramp stops at six. renderSvg and renderer are mutually exclusive. DEFAUT OUVERT 2026-09-14 - the six Figma steps are assumed to be the counterpart of CHART_PALETTE but the values were never compared. Until someone diffs them, treat the ramp as a Figma-side convention, not as proven parity. Second open point: a one-series chart pins utility-brand-600 here, while the React color prop and the Figma collection 7. Accent both express an accent that can be switched. Two mechanisms for one job."
  size: {w: 360, h: 200}
  direction: VERTICAL
