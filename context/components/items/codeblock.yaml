  description: "AXES - collapse (none, collapsed, expanded): whether the block truncates, and which way the chevron points. 3 variants. - No axis carries the code itself. The content is _CodeBlockLine instances, that is geometry and text. Changing a line is an instance override, never a component property. COMPOSITION - The shell IS a cardscard instance, variant=default, with its padding overridden to 0 horizontally and 12 vertically. This component does not draw a surface of its own. - The Content slot holds _CodeBlockLine instances, each in FILL. - _CodeBlockControls is absolutely positioned, 8 from the top and from the right edge. On a single-line block, centre it vertically instead. - collapse=collapsed adds a Fade rectangle carrying the Gradient/Fade/Bottom paint style, pinned to the bottom edge. ACCESSIBILITY - The controls row floats over the code: keep it clear of the first line's reading zone. - The fade must never be the only signal that content is hidden; the chevron carries that. CODE - @42/ui-react CodeBlock, in react/kit v0.8.0. NOT present in kit-main. Highlighting is Shiki, so the client component renders a plain unhighlighted pre until it resolves. - collapse -> collapsedLines plus expanded / defaultExpanded. collapse=none means collapsedLines is omitted. - CodeBlock.Static is the Server Component twin: same chrome, zero client JS spent on Shiki. - CodeBlock.Button is published separately here as CodeBlock / Button; use it for a custom entry in the controls prop. - Ship @42/ui-react/code-block/styles.css alongside the component; it is not part of the universal colours chain."
