  page: "      ↳ Indicator"
  description: "AXES - type (dot, label): the shape axis. dot = bare circle, no text; label = counter pill whose width hugs its content (min-width = height). - size (xs, sm, md, lg, xl): dot diameter 6/8/10/12/14; label height 12/14/16/18/20, padding 2/4/4/6/6, counter 8/9/10/11/12 px. - color (brand, gray, red, orange, yellow, green, blue, purple, pink): palette axis, React hue names. - label (TEXT), withBorder (BOOLEAN), processing (BOOLEAN): composition, not shape. - 90 variants, type x size x color flattened into one set. No state axis: an indicator is not interactive. COMPOSITION - The component IS the pastille alone. It does not wrap its host: lay it over an Avatar / ActionIcon / icon by absolute position. On a circular host, pull it inward by roughly 15% of the diameter (-4/-5/-6/-7/-9 by size) so it sits ON the rim instead of floating past the bounding-box corner. - Surface bound to bg-*-solid (brand, red, orange, green, purple, pink) or utility-*-500 (gray, yellow, blue). Counter in text-primary-inverse. Radius radius-full on dot, radius-xl on label. - Ring = withBorder: a 2 px INSIDE stroke bound to bg-solid, the floor of the page, so the pastille reads as cut into whatever it overlays. On a coloured surface (a gradient card, a tinted panel) rebind it to that surface. - Pulse = processing: a 2 px ring at 50% in the palette colour. It is the static transcription of the React CSS animate-ping (a filled disc scaling 1 to 2, opacity 0.75 to 0) - Figma can only show one frame of it. - The counter is Kode Mono Bold: it is a quantity (foundations-typography). A short text that NAMES rather than counts (New, Beta) belongs to Badge, not here. ACCESSIBILITY - The pastille is decorative (aria-hidden in React): the status must be readable in the surrounding text, never in the hue alone. - Counters at 8 and 9 px (xs, sm) are under any legible threshold for a digit: use those two sizes as dots, not as counters. - The counter binds to text-primary-inverse, which FLIPS with the mode: dark #030d20 in Dark, white in Light - the same pairing Badge variant=filled ships. Measured, it only holds in Dark: every palette clears 5:1 there except purple (4.0:1). - In LIGHT mode the white counter fails AA on eight of the nine palettes (brand 3.4:1, gray 3.6, red 3.3, orange 3.2, yellow 2.1, green 2.8, blue 3.3, pink 3.4); only purple passes at 4.5:1. The counter is a duplicate of information available elsewhere, never the only carrier of it - and yellow in Light is unusable. Inherited drift, filed in ds-actions. CODE - React: Indicator (@42/ui-react). The Figma type axis is DERIVED, not a prop: label set renders the badge, label absent renders the dot. size, color, label, withBorder and processing map one to one. - React props with no Figma equivalent, all placement or logic: position (9 cells), offset, maxValue, showZero, disabled, inline, zIndex, and radius (Figma pins the xl default). - React palettes teal and cyan have NO token in this DS, neither semantic nor utility ramp. gray, yellow and blue fall back on utility-*-500 for want of a bg-*-solid. Filed in ds-actions. - The counter drops to 8 px where the smallest typography token is text-xs (12): only size=xl has its font size bound."
