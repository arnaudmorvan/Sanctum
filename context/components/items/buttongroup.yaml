  page: "      ↳ ButtonGroup"
  description: "Joins adjacent Buttons into one segmented block: inner corners flattened, adjacent borders collapsed into a single hairline. Use for view switchers (Day/Week/Month), toolbars, split actions (a primary action plus a menu trigger). Do not use for single-choice selection with a selected state → SegmentGroup. Or to set a primary action against a secondary one (Cancel/Confirm) → two spaced Buttons. Every item is a Button instance: label, icons, size, state and disabled are set on the nested instance. An icon-only item is a Button with showLabel turned off. Dividers are _ButtonGroupSeparator instances — add or remove them by hand when the item count changes. variants and color apply to the whole group. Keep the same size across items, otherwise the edges stop lining up. In code (@42/ui-react): ButtonGroup only carries orientation. variants and color go on each child Button. An icon-only item maps to the ActionIcon component."
  size: {w: HUG, h: HUG}
