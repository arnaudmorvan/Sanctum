  page: "      ↳ Slider"
  description: "Slider - a value picked by dragging along a track. 8 variants: range x value. AXES - range (single, range): one thumb or two. The real shape axis. - value (50%, 25%, 75%, 100% for single; 25-75%, 0-75%, 0-100%, 0-25% for range): the thumb position, frozen as an axis for spec only. Not every position exists - pick the closest and say the real number in words. - showMarksLabel: the row of numbers under the track. Turning it off removes the row and the component reflows from 86 to 62 high. - showMarksDots: the tick dots on the track itself. Purely visual, no reflow. - The nested _Control handle is exposed: its State (Default, Focused, hover) and its showLabel - the value bubble above the thumb - are set on the handle, not here. COMPOSITION - Vertical auto-layout, 38 top padding reserved for the value bubble, then TrackRow (24 high) and MarksRow (18 high), gap 6. - Inside TrackRow everything is free-positioned on purpose: Range overlays Track, the dots sit on the track, and the thumbs are centred on their value - a thumb at 0 percent sticks out 12 px to the left. TrackRow does not clip. - Width is fixed at 320 and does not follow its container. Figma cannot express a thumb at a percentage of a fluid width, so a wider slider has to be resized by hand. ACCESSIBILITY - The value bubble is the only on-screen readout. With showLabel off, the current value must be written next to the slider or the control is unreadable without dragging. - Focus lives on the thumb (_Control handle State=Focused), never on the track. CODE - @42/ui-react Slider - range -> a value array of two numbers instead of one; there is no range prop. - value -> value / defaultValue. min defaults to 0, max to 100, step is free. - showMarksLabel + showMarksDots -> the single marks prop, an array of {value, label}. A mark with no label draws the dot only; that is the closest thing to showMarksDots alone. - _Control handle showLabel -> showLabel, which takes hover (the default), always, never or a boolean; label formats the bubble. - _Control handle State -> runtime data-* (data-dragging, focus-visible), never a class you set. KNOWN ISSUE - size (xs, sm, md, lg, xl - React defaults to md) has no Figma axis. Everything here is md. - color (the 11-colour palette) has no Figma axis. Everything here is brand. - disabled and invalid exist in React and have no Figma variant. A disabled or errored slider cannot be specced in this file. - The value axis lists 8 positions out of a continuous range; it is a sample, not the API. - Rebuilt 2026-08-28: the component had no auto-layout and both booleans were bound to nothing - toggling them did nothing at all. Structure and bindings fixed, geometry unchanged (320x86)."
