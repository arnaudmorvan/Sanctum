  page: "      ↳ Switch"
  description: "AXES - 6 axes, 32 key variants: pressed x size (sm | md) x text x state (default | hover | focus | disabled). type has a single value, default. - pressed and state are runtime, not design axes. - text and supporting-text are composition booleans: the inline label and the helper line. - size stops at sm/md, so the xs, lg and xl steps used in code have no Figma equivalent. COMPOSITION - Vertical auto-layout, hug x hug, gap 10. Slot Button (FRAME, depth 2) holds the track. - One nested instance, _Toggle base42, carrying type / pressed / size / state. - The text block sits beside the track when text=true; supporting-text adds a second line under it. - For an immediate binary setting. For a value submitted with a form, prefer checkbox-v2. ACCESSIBILITY - The label must be the accessible name; the track on its own carries none. - The on/off state must be exposed semantically: thumb position and fill colour are not enough. - Do not let the green fill alone mean on. CODE - React: Switch (Ark UI Switch). The Figma name toggle was renamed switch in code. - Props: checked, defaultChecked, onCheckedChange, label, description, error, required, invalid, disabled, readOnly, size, color (defaults to green), name, value, id, ref, onBlur. - pressed -> checked, driven at runtime through Ark data-[state=checked]; state -> data-focus-visible / data-disabled / data-invalid, never a variant. - text -> label, supporting-text -> description. - size: React xs/sm/md/lg/xl vs Figma sm/md, mismatch. Only size is a cva variant; there is no shape variant."
