  page: "      ↳ Card"
  description: "Card - a surface that groups a header, a body and a footer. 30 variants: variant x padding. AXES - variant (default, filled, light, outline, gradient): the chrome. - padding (md, none, xs, sm, lg, xl): the inset on all four sides. md leads the list because it is the default, not because the scale starts there. - Header, Content, Footer are SLOTs, each with its own show boolean. Drop anything in them. COMPOSITION - Vertical auto-layout, gap 12, width 320 by default, height hugs its content. - The padding is on the root only. A region that needs its own inset sets it inside its slot content. ACCESSIBILITY - A Card is not a button. If the whole surface is clickable, the target must be a real control inside it, not the div. - gradient and light differ by contrast, not only by hue: check the text against the surface in both themes. CODE - @42/ui-react Card - variant -&gt; variant, padding -&gt; padding. The two scales are identical, value for value: none = p-0, xs = p-2 (8), sm = p-3 (12), md = p-4 (16), lg = p-6 (24), xl = p-8 (32). - Defaults match on both sides: variant=default, padding=md. - Header / Content / Footer -&gt; the compound children Card.Header, Card.Content, Card.Footer (plus Card.Title and Card.Description inside the header). - The show booleans have no prop: omit the child and it is not rendered. - React also takes color, and a gradient prop object. Here gradient is a variant, and its colours come from the variables - not something to expose as a separate axis. KNOWN ISSUE - Fixed 2026-08-31: cloning a variant that holds SLOT nodes silently degrades them into plain FRAMEs. The 25 variants with padding other than md, created on 2026-08-28 by cloning, had lost all three slots AND the three show booleans bound to them. Only the five padding=md variants still worked, so changing padding on an instance froze the card. All 30 variants now carry real SLOT nodes rebound to their properties. Rule: never clone a variant that contains slots without rebinding them afterwards."
