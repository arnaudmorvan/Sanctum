  how_to_use: "1. Instancier via key_variants (jamais le ComponentSet).\n2. Exemple : const variantNode = await figma.getNodeByIdAsync(key_variants[\"<variant-slug>\"]); const inst = variantNode.createInstance()\n3. setTxt(inst, \"Label\", \"Heures de code\")\n4. setTxt(inst, \"Value\", \"1 248\")\n5. Si besoin masquer les actions : inst.findOne(n => n.name === \"Delta badge\")?.setProperties({\"Close\":false,\"ShowLeading\":false,\"ShowText\":false,\"ShowTrailing\":false})"
