  page: "      ↳ Charts"
  description: "Chart tooltip - the hover card of a chart: a date, then one row per series. AXES - series: 1, 2 or 3 rows. COMPOSITION Date at the top in Kode Mono (machine register), then per row a dot in the EXACT colour of the series, the name in Lato, and the value right aligned in Kode Mono Bold. Surface on bg-solid with a border-secondary stroke, radius xs. It is laid OVER the chart, absolutely positioned on the parent frame: x and y cannot be overridden inside an instance. ACCESSIBILITY The dot repeats the series colour, so the name next to it is what actually identifies the series. Never ship the dots alone. CODE @42/ui-react, component Chart (import from index.ts/chart), a wrapper over TanStack Charts. The chart TYPE is not a prop: it comes from the definition and the marks passed to the chart. So the variant axes below do NOT map one to one onto React props, they map onto separate definitions. Colour maps exactly: color takes one Color for a one-series chart (sets data-color and the ts-chart-1 slot), colors takes an ordered Color array for a multi-series chart (sets ts-chart-1 to ts-chart-N, see CHART_PALETTE and chartColors). TanStack cycles six categorical slots by default, which is why the Figma ramp stops at six. renderSvg and renderer are mutually exclusive. TanStack owns the tooltip: this component is the visual spec of that slot, not a component to port as is. DEFAUT OUVERT 2026-09-14 - this does NOT derive from the DS tooltip (1052:489). That component declares showContentSlot but its contentSlot is a FRAME and not a SLOT, so nothing can be inserted into it. Same pattern as the other declared-but-unwired props of this file. Re-derive as soon as the slot is repaired. Surface is bg-solid and not bg-inverse on purpose: a light surface flattens the brand ramp dots. DEFAUT OUVERT 2026-09-14 - the six Figma steps are assumed to be the counterpart of CHART_PALETTE but the values were never compared. Until someone diffs them, treat the ramp as a Figma-side convention, not as proven parity. Second open point: a one-series chart pins utility-brand-600 here, while the React color prop and the Figma collection 7. Accent both express an accent that can be switched. Two mechanisms for one job."
