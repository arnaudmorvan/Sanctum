  description: "AXES - No axis, no colour, no state on the container: everything is delegated to _Timeline / _Item and its atoms. COMPOSITION - Vertical auto-layout, gap 0, fixed width, hug height. - One slot, items, to be filled only with _Timeline / _Item instances. - Any number of steps. Set showConnector = false on the last item. - Replaces Timeline [V2], deprecated. ACCESSIBILITY - Reading order is the order of the items in the items slot. - A step state must stay readable in the text, not only in the colour of the bullet. CODE - React: Timeline wrapping Timeline.Item children, colour through the color prop. - Not implemented in @42/ui-react as of 2026-08-28: 52 components, no Timeline. components.md only lists Steps (wraps Ark Steps), unchecked. KNOWN ISSUE - The slot was named Items until 2026-08-28; it is now items, to match RadioGroup and ChoiceCardGroup."
