  page: "      ↳ File Upload"
  description: "FileInput - dropzone plus the queue of files being uploaded. 2 variants. AXES - showFilesQueued (False, True): whether the list of queued files is drawn under the dropzone. - progressStyle: one value only, Progress bar. A second style was planned and never built. - The nested _File upload base is exposed. Its state (Default, Hover, Disabled), showDropHint and withButton are set there, not here. COMPOSITION - Vertical auto-layout, width 512, hug height, gap 16: dropzone, then the queued file list. - Each queued row is a _File upload item base instance: its own state carries In progress / Complete / Error. ACCESSIBILITY - The dropzone must stay reachable by keyboard: the action button is the real control, drag and drop is an enhancement. - Upload progress needs a text percentage, not only the bar. CODE - @42/ui-react FileUpload - withButton -> withButton. state=Disabled -> disabled. showDropHint has no prop, the hint text is always rendered. - showFilesQueued has no prop: the queue renders whenever value holds files. - Item states (In progress / Complete / Error) come from the upload lifecycle, never from a class you set. - React-only, do not try to mock these up: accept, maxFiles, maxFileSize, directory, onDrop, hint, size, color, invalid, name, id. KNOWN ISSUE - progressStyle is a single-value axis and carries no information. Either build the second style or remove the axis. - Renamed 2026-08-28: Type -> progressStyle, File drag and drop -> showDropHint, State -> state, and withButton was added to match React. - The previous description was wrong: it announced 3 axes and 8 key variants including a breakpoint (desktop | mobile). Neither the breakpoint axis nor those variants exist - the set holds 2."
