  description: "AXES - state (default, hover, focus, disabled): the four visual states. Runtime states, published so a mockup can show them. - Icon swap: an INSTANCE_SWAP property, default copy. Any UI system icon goes in. - 4 variants. COMPOSITION - 24 x 24 fixed, radius 4. No fill at rest, bg-hover on hover, Focus rings/focus-ring on focus, 50 percent opacity when disabled. - The icon is 14 x 14, colour bound to text-secondary. - DELIBERATELY smaller than the xs floor of ActionIcon, which is sized for general-purpose use, not a compact strip floating over code. Never instantiate actionicon in its place. ACCESSIBILITY - The icon carries the whole meaning, so the button needs its own accessible name, and that name changes with what it does: Copy / Copied, Show more / Show less. - The tooltip is the label, not a decoration. CODE - @42/ui-react CodeBlockButton, exported as CodeBlock.Button, in react/kit v0.8.0. - state has NO prop: hover, focus and disabled are CSS states (hover:bg-(--c-soft), focus-visible:ring-2 ring-brand-500, disabled:opacity-50). The axis exists so a mockup can show them. - Icon swap -> children. The component takes any node, not an icon name. - asChild is supported through HTMLArkProps; that is how the built-in buttons wrap themselves in a Tooltip."
  size: {w: 24, h: 24}
  radius: 4
  direction: HORIZONTAL
  align: {primary: CENTER, counter: CENTER}
