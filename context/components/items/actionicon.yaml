  how_to_use: "1. Instancier le composant via figma_node_id (createInstance()).\n2. Si besoin masquer les actions : inst.findOne(n => n.name === \"Buttons/Button \")?.setProperties({\"showEndSlot\":false,\"showLabel\":false,\"showStartSlot\":false})"
