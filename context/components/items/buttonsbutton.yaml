  description: "Button - the primary action control. 300 variants: color x size x variants x state. AXES - variants (filled, light, outline, subtle, link): the shape axis. Despite the plural name it holds one value; React calls it variant. - color (gray, brand, red, green, orange): the palette axis, orthogonal to shape. It carries no hierarchy on its own - red is destructive only because the label says so. - size (xs, sm, md): height and type ramp. See KNOWN ISSUE - this ramp does not match the code. - state (Default, Hover, Focused, Disabled): runtime state, frozen here as an axis for spec only. Compose screens with Default. - label (TEXT) + showLabel: the caption. - startSlot / endSlot (INSTANCE_SWAP) + showStartSlot / showEndSlot: the two adornment slots. LOADING There is no loading value on the state axis, and there will not be one: it would cost 225 extra variants for a state the code owns at runtime. To spec a loading button: swap a Spinner into startSlot, turn showStartSlot on, turn showEndSlot off. That mirrors the code exactly - loading renders a Spinner in the start slot position, drops both slots, and sets disabled, aria-busy, data-loading and cursor-progress. COMPOSITION - Horizontal auto-layout; the label sits between the two slots. Padding is symmetric (8 on xs, 10 on sm/md). - Icon-only: do NOT hand-roll it here. Use ActionIcon (23149:52), which composes this component with showLabel off and a single slot on. Hiding the label on a raw Button instance does yield the right square (36 / 40 / 44) but the wrong code mapping - Code Connect must point at ActionIcon, a sibling React component with its own cva, not at Button. - Not for a dialog dismiss: Modal owns its own close control. ACCESSIBILITY - color only recolours. The consequence belongs in the label, never in the hue alone. - state=Focused specs the focus ring; in code it comes from focus-visible (ring 2, brand-500, offset 2), never from a class you set. CODE - @42/ui-react Button - variants -> variant, size -> size, color -> color (emitted as data-color). - startSlot / endSlot -> startSlot / endSlot (ReactNode). showStartSlot / showEndSlot have no prop: pass the node or do not. - state is never a cva variant: Disabled -> disabled, Hover / Focused -> runtime data-*. - asChild swaps the rendered element and folds startSlot / endSlot into that element's own children (Ark uses Children.only). - React defaults: variant=filled, size=md. Button has NO radius prop - the corner comes from the rounded-button token. KNOWN ISSUE - SIZE RAMP IS OFF BY +8 px. Figma renders xs 36 / sm 40 / md 44; React is 28 (h-7) / 32 (h-8) / 36 (h-9). Systematic, measured 2026-09-14: Figma adds vertical padding and a 20 px line-height on xs and sm where React fixes the height outright. Figma xs has the height of React md. ThemeIcon, in this same file, matches its code exactly (28..48) - so this is a Button problem, not a file-wide one. - Icon sizes here are 20 / 20 / 24. React Button uses 12 / 14 / 16 (size-3 / size-3.5 / size-4); 20 / 22 / 24 are ActionIcon's values. This component already draws ActionIcon-sized icons in a Button box. - The axis is named variants (plural) but holds a single value; React calls it variant. Rename pending. - variants=link has no React equivalent. - React ships 12 colors (brand, gray, neutral, red, orange, yellow, green, teal, cyan, blue, purple, pink); Figma publishes 5. neutral is the old inverted white/dark-navy look promoted to a palette value - React's variant=default was removed from Button and now survives only on ActionIcon. - size lg and xl exist in React, not here. - state=Focused is a typo of focus. - Rewritten 2026-09-14 against kit v0.8.0. The 2026-08-28 pass claimed React defaults of variant=default / radius=sm, a size axis reaching lg, and 400 variants: all three were wrong."
