  description: "Progress bar - a determinate value drawn on a horizontal track. 12 variants on one axis. AXES - Progress (0%, 10% ... 90%, 100%, 100% success): the runtime value frozen as 12 steps. In code this is a number, never an axis. The 100% success value also smuggles a status into the value axis. - showHeader: the title row above the bar. - title (TEXT): the header caption. - percentage (TEXT): the value caption. One property, reused by the top, right and bottom labels at once. - showRightLabel / showBottomLabel: where the value caption sits - inline after the bar, or under it. - showTopTooltip / showBottomTooltip: a floating bubble over or under the fill. COMPOSITION - Vertical auto-layout, 320 wide by default and RESIZABLE since 2026-08-31, height hug. Widen the instance and the track follows. - Track plus filled range; the fill is the only thing the Progress axis changes, and it is now PROPORTIONAL: the fill carries a SCALE constraint and the track a STRETCH one, so Progress=50% is half the bar at 320, at 800 and at 1200. Before 2026-08-31 the bar was frozen at 320 and the fill was drawn in absolute pixels. - No slot and no nested instance: every label is baked in. - Inline determinate progress only. For indeterminate activity use the loading indicator; the ring counterpart is CircularProgress. ACCESSIBILITY - role=progressbar with value / min / max is required; Ark wires it from the value prop. - 100% success must not be colour-only: keep a glyph or a text confirmation. - Any sweep animation must respect reduced-motion. CODE - @42/ui-react Progress - Progress -&gt; value (a number in min..max; null = indeterminate) plus defaultValue, min, max, onChange. 100% success has no preset: use color green and add your own glyph. - title / percentage have no props: the React bar renders no label. Compose them around the bar. - React-only: size xs..xl, variant filled | gradient, color via data-color, gradient config. KNOWN ISSUE - percentage CANNOT follow the Progress axis. It is a single set-level TEXT property with one default (0%) shared by all 12 variants - Figma has no way to make a text default vary per variant. Picking Progress=70% leaves the caption reading 0% until you type 70% yourself. Always retype it; treat a mismatched pair as a bug in the screen, not in the component. - The same percentage property feeds three separate labels, so the top, right and bottom captions can never disagree - which is right, but it also means you cannot show a value and a target at once. - No size and no color axis at all. - Description rewritten 2026-08-28: the previous one documented a label axis (false | right | bottom | top text % ...) and 84 key variants. That axis is gone; it is now the five show* booleans, and the set holds 12 variants."
