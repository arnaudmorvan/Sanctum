  description: "Toast card - the transient, non-blocking feedback the notifier spawns. Same body as Alert, narrower, with a shadow and an enter/exit animation in code. AXES - type (8 variants): info, warning, error, success, plus type5..type8. Only the first four are named; the other four are the same four statuses on the outline surface. The axis carries the status AND the surface at once - see KNOWN ISSUE. - No other axis. Everything else is a preset frozen inside the wrapped _baseAlert instance. COMPOSITION - Each variant is a vertical wrapper holding one _baseAlert instance, preset to closable on, showAction on, showDescription on, showIcon on. Height 116, width 530. - The action row is the native Actions slot of _baseAlert: drop the real control in it rather than restyling the seeded button. - Spawned by the notifier, never placed by hand in a screen. For an inline card use Alert. ACCESSIBILITY - The leading glyph is decorative: the status has to be in the title text. - A toast is announced by the notifier region, not by the card. Keep the close control reachable: it is a real button with aria-label Dismiss in code. - Auto-dismiss is a timing constraint, not a visual one: 5000 ms by default, and never for type loading. CODE - Notification, imported from @42/ui-react/notification. Docs: https://42kit.dev/docs/notification - type -> type. The named half of the axis -> variant=\"light\", the type5..type8 half -> variant=\"outline\". - closable -> withCloseButton. On here matches the React default, which is the opposite of Alert. - The React root is w-88 (352) with shadow-2xl and the toast-in / toast-out keyframes driven by Ark Presence through data-state. The Figma card is 530 wide, flat and static. - Compound parts reused as-is by Alert: Notification.Root / .Icon / .Title / .Description / .ActionTrigger / .CloseTrigger. KNOWN ISSUE - type5..type8 are Figma auto-generated names left over from duplicating variants. They are not statuses: they are the outline surface of the four real ones (type8 = info, type7 = warning, type6 = error, type5 = success). - The set should be split into two axes, type (info | warning | success | error) x variant (light | outline), exactly like _baseAlert. - The nested _baseAlert is not an exposed instance, so an instance of this set can only change its variant - title, description, closable, showAction and showIcon are unreachable. Turn on Expose nested instance on the _baseAlert child of each variant to get them back. - The boolean is named closable here and withCloseButton in the shipped API. Rename it to withCloseButton so the axis and the prop match. - Not mocked: type=\"loading\" (the leading glyph becomes a Spinner and the toast never auto-dismisses) and withCollapse (a chevron that folds the description and action rows away, with defaultOpen / open / onOpenChange). Both are in the shipped API. - Three component sets named Notification live in this file as of 2026-08-26: this one, plus two older ones on the page Notification (6 type variants and 135 variant x color x trailing variants). Only this one is built on _baseAlert; the other two should be removed."
