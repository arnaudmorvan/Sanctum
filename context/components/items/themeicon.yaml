  page: "      ↳ ThemeIcon"
  description: "ThemeIcon — a square, non-interactive box that displays one icon. Decoration, not a control. AXES color = accent palette, never hierarchy brand = product-level accent, the default gray = neutral, carries no status meaning red = failure, blocked, destructive outcome orange = warning, pending, in progress yellow = caution, low-severity attention green = success, valid, done blue, purple, pink = categorical only, no semantics attached size = square footprint, identical to ActionIcon at the same size xs = 28px box, 20px icon sm = 32px box, 22px icon md = 36px box, 24px icon lg = 40px box, 28px icon xl = 48px box, 32px icon variant = emphasis, strongest to weakest. All four are muted surfaces — none of them reads as a button. filled = 15% accent wash behind a darker border, raised feel light = tinted accent surface, no border outline = accent border, no fill subtle = accent icon only, no fill, no border radius = corner shape md = 8px, the default square glyph full = circular glyph The code scale also has xs / sm / lg / xl. For those, override the corner radius on the instance with the matching radius-* token rather than detaching. COMPOSITION One icon, centred. No text, no second slot, no wrapping. Icons come from lucide and inherit the ThemeIcon foreground — never recolor an icon on the instance. The icon size follows the size axis; do not resize it by hand. filled paints a separate `surface` layer at 15% node opacity behind the icon so the accent blends with whatever sits under it. Leave that layer alone — paint opacity is not inherited by instances, node opacity is. ACCESSIBILITY ThemeIcon is not a control — no focus ring, no hover, no keyboard target, no cursor affordance. If it has to be clicked, use ActionIcon. The icon is decorative: what it means has to be written somewhere else on the screen. outline and subtle borrow the page background — re-check contrast when the surface is not the default one. CODE — @42/ui-react <ThemeIcon> color -> color (\"brand\" | \"gray\" | \"red\" | \"orange\" | \"yellow\" | \"green\" | \"blue\" | \"purple\" | \"pink\"). The code type also accepts teal and cyan; those have no Figma tokens yet. size -> size (\"xs\" | \"sm\" | \"md\" | \"lg\" | \"xl\"), default \"md\" variant -> variant (\"filled\" | \"light\" | \"outline\" | \"subtle\") radius -> radius (\"md\" | \"full\" here; the code adds \"xs\" | \"sm\" | \"lg\" | \"xl\"), default \"md\" 🔀 Icon swap -> children. The box renders whatever it is handed, there is no icon prop. No Figma equivalent — do not mock these up here: variant=\"default\" (neutral gray surface that ignores color — it is the React default value) asChild (Ark polymorphism)"
  size: {w: 36, h: 36}
  radius: 8
  direction: HORIZONTAL
  align: {primary: CENTER, counter: CENTER}
  stroke: {color: "@transparent", width: 1, align: INSIDE}
  slots:
    icon: {slot_id: "21644:142", node_type: INSTANCE, depth: 1}
