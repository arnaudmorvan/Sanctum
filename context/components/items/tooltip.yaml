  page: "      ↳ Tooltip"
  description: "AXES - arrow (none | top center | bottom center | bottom left | bottom right | left | right): 7 frozen arrow placements. In code this is one boolean plus a placement, not a variant axis. - supporting-text (false | true): slot, adds a second line under the label. - text: a Figma text property, not a variant. - 14 key variants = supporting-text x arrow. No size, no color, no state axis. COMPOSITION - Vertical auto-layout, hug x hug, counter CENTER, shadow @shadow-lg. - Inverted bubble: text 14/20 SemiBold on @text-primary-inverse. One text node, Text. - Anchored to a trigger only. Never place it inline in page flow, and never put interactive controls inside it. ACCESSIBILITY - Must open on keyboard focus as well as hover, and dismiss on Esc; hover-only is a fail. - Never the sole carrier of essential information: it is a hint, not content. - The arrow is decorative and must not be the only way to identify the trigger. - Never trap focus: that is Popover territory. CODE - React: Tooltip (over Ark UI Tooltip). Props: label, position, offset, withArrow, variant, asChild, withinPortal, container, classNames. - arrow -> withArrow (boolean) plus position; position takes Ark placements plus RTL-aware start / end. supporting-text -> richer label content, no prop. - React variant (text | inline) styles the trigger, not the bubble, and has no Figma axis. - opened is runtime: Ark writes data-state and wires role=tooltip plus aria-describedby. Never model it as an axis. - offset maps to the positioner gutter."
  size: {w: HUG, h: HUG}
  direction: VERTICAL
  align: {counter: CENTER}
  shadow: ["@shadow-lg"]
  text:
